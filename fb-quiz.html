<!DOCTYPE html>
<html lang="de" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medizinische Terminologie - Prüfung</title>
    <link rel="stylesheet" href="fb-quiz.css?v=20260302">
</head>

<body>

    <nav class="sticky-nav">
        <!-- Top Row: Brand, Stats, Global Actions -->
        <div class="nav-top-row">
            <!-- Brand / Title -->
            <div style="font-weight:800; font-size:1.2rem; display: flex; align-items: center; gap: 10px;">
                <span>🩺 Quiz</span>
            </div>

            <!-- Stats -->
            <div class="nav-stats">
                <div class="nav-stat-item">
                    <span class="nav-stat-value" id="stat-progress">0/0</span>
                    <span class="label">Beantwortet</span>
                </div>
                <div class="nav-stat-item">
                    <span class="nav-stat-value" style="color:var(--success)" id="stat-correct">0</span>
                    <span class="label">Richtig</span>
                </div>
                <div class="nav-stat-item">
                    <span class="nav-stat-value" style="color:var(--danger)" id="stat-wrong">0</span>
                    <span class="label">Falsch</span>
                </div>
            </div>

            <!-- Actions -->
            <div class="nav-actions">
                <button class="btn" onclick="checkAll()">
                    <span>📝</span> <span class="label">Alle Prüfen</span>
                </button>
                <button class="btn btn-danger" onclick="confirmReset()">
                    <span>↻</span> <span class="label">Auswahl löschen</span>
                </button>
                <button class="btn" onclick="toggleTheme()" id="theme-btn">🌙</button>
            </div>
        </div>

        <!-- Bottom Row: Modes -->
        <div class="nav-controls-row">
            <div class="control-group">
                <span class="mode-label">Frage-Modus</span>
                <div class="switch-container">
                    <div class="switch-option">
                        <input type="radio" id="mode-term" name="qmode" value="term"
                            onchange="changeQuestionMode('term')" checked>
                        <label for="mode-term">Begriff</label>
                    </div>
                    <!-- <div class="switch-option">
                        <input type="radio" id="mode-mixed" name="qmode" value="mixed"
                            onchange="changeQuestionMode('mixed')">
                        <label for="mode-mixed">Zufall</label>
                    </div> -->
                    <div class="switch-option">
                        <input type="radio" id="mode-def" name="qmode" value="definition"
                            onchange="changeQuestionMode('definition')">
                        <label for="mode-def">Erklärung</label>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <span class="mode-label">Prüf-Modus</span>
                <div class="switch-container">
                    <div class="switch-option">
                        <input type="radio" id="eval-immediate" name="emode" value="immediate"
                            onchange="changeEvalMode('immediate')">
                        <label for="eval-immediate">Sofort</label>
                    </div>
                    <div class="switch-option">
                        <input type="radio" id="eval-manual" name="emode" value="manual"
                            onchange="changeEvalMode('manual')" checked>
                        <label for="eval-manual">Manuell</label>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="quiz-container" id="quiz-list">
        <!-- Questions will be injected here -->
        <div style="text-align:center; padding: 40px; color: var(--header-text);">
            Lade Fragen...
        </div>
    </div>

    <!-- Generic Confirm Modal -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal">
            <h2 id="modal-title">Bestätigung</h2>
            <p id="modal-text">Bist du sicher?</p>
            <div class="modal-actions">
                <button class="btn" onclick="cancelModal()">Abbrechen</button>
                <button class="btn btn-danger" id="modal-confirm-btn">Bestätigen</button>
            </div>
        </div>
    </div>

    <script type="module" src="fb-quiz.js?v=20260302"></script>
</body>

</html>
