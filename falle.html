<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Münster Fälle Übersicht</title>
    <style>
        :root {
            --primary-color: #165A5A;
            --secondary-color: #f0f4f8;
            --text-color: #333;
            --border-radius: 8px;
            --accent-red: #d32f2f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
            color: var(--text-color);
            padding-bottom: 100px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Accordion Style */
        details {
            background-color: white;
            margin-bottom: 12px;
            border-radius: var(--border-radius);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid #e1e4e8;
        }

        /* Specialty summary */
        details.specialty-group>summary {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.15em;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Case item within specialty */
        details.case-item {
            margin: 10px 0;
            border: 1px solid #ddd;
            box-shadow: none;
        }

        details.case-item>summary {
            background-color: #f8f9fa;
            color: var(--primary-color);
            padding: 12px 15px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.05em;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid transparent;
        }

        details.case-item[open]>summary {
            border-bottom: 1px solid #ddd;
            background-color: #eef2f2;
        }

        /* Custom arrow for all accordions */
        summary::after {
            content: '+';
            font-size: 1.2em;
            transition: transform 0.2s;
        }

        details[open]>summary::after {
            transform: rotate(45deg);
        }

        .specialty-content {
            padding: 10px 20px;
            background-color: #ffffff;
        }

        .case-content {
            padding: 20px;
            background-color: #fff;
        }

        /* Case Details Style */
        .case-diagnosis {
            font-size: 1.1em;
            color: var(--accent-red);
            margin-bottom: 15px;
            font-weight: bold;
            padding: 12px;
            background-color: #fff8f8;
            border-left: 5px solid var(--accent-red);
            border-radius: 4px;
        }

        .case-description {
            line-height: 1.7;
            white-space: pre-wrap;
            background-color: #fafafa;
            padding: 20px;
            border-radius: 4px;
            font-size: 1em;
            color: #333;
            border: 1px solid #eee;
        }

        .case-description strong {
            color: var(--primary-color);
            font-weight: 700;
        }

        /* Utility */
        .badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: normal;
        }

        details.case-item .badge {
            background: rgba(22, 90, 90, 0.1);
            color: var(--primary-color);
        }

        /* Floating buttons */
        .fab-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1000;
        }

        .fab {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            transition: transform 0.2s, background-color 0.2s;
        }

        .fab:hover {
            transform: scale(1.1);
            background-color: #1a6d6d;
        }

        .fab-label {
            position: absolute;
            right: 60px;
            background: #333;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .fab-wrapper:hover .fab-label {
            opacity: 1;
        }

        .fab-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
    </style>
</head>

                    case_description: `**Patient:** Herr Paul Hübner, 67 Jahre (geb. 11.10.1954), 87 kg, 168 cm.

**Aufnahmegrund:**
Plötzlich aufgetretene, seit 1 Stunde bestehende, progrediente linksseitige Hemiparese.

**Aktuelle Anamnese:**
Der Patient habe die Beschwerden beim Aufstehen bemerkt und umgehend ein Taxi gerufen, um sich in der Notaufnahme vorstellen zu können. Begleitend seien dem Patienten folgende Symptome aufgefallen: linksseitige Hypästhesie sowie Adynamie, beidseitiger Strabismus, Ataxie, Dysarthrie und Vertigo.

**Vegetative Anamnese:**
Es hätten sich Nausea, seit 3-4 Jahren rezidivierende Diarrhöen (Colon irritabile, dagegen nehme er Imodium) sowie stressbedingte Insomnie ergeben.

**Vorerkrankungen und Voroperationen:**
- Arterielle Hypertonie, seit 13 Jahren bekannt.
- Diabetes mellitus Typ II, seit 9 Jahren bekannt.
- Hyperlipidämie, seit 8 Jahren bekannt.
- Zustand nach PTA der rechten Carotis (Carotisstenose) vor 6 Jahren.
- Zustand nach Nasenkorrektur (nicht Septumkorrektur) vor 17 Jahren.

**Medikamente:**
- ASS 100 mg (1-0-0)
- Atacand 8 mg (1-0-0) gegen arterielle Hypertonie.
- Euglucon 3,5 mg (1-0-0) gegen Diabetes mellitus Typ II.
- Sortis 20 mg (0-0-1) gegen Hyperlipidämie.

**Allergien:**
- Birkenpollen mit Rhinokonjunktivitis.
- Apfel-Unverträglichkeit (Ursache: Pektin).

**Noxen:**
- Nikotinkonsum: 42 Packungsjahre (PY).
- Alkoholkonsum: 1-2 Gläser Bier täglich.
- Drogenkonsum: Kokain (kann zu Vasospasmen und ischämischem Apoplex führen).

**Familienanamnese:**
- Vater: Wundheilungsstörung „wenn er sich stürze“, aktuell keine Wunden.
- Mutter: Anus praeter bei Zustand nach partieller Kolektomie im Rahmen einer chronisch-entzündlichen Darmerkrankung (wahrscheinlich Colitis Ulcerosa – Patient habe erwähnt, dass der Arzt von Krebsrisiko gesprochen habe). Diesbezüglich sei die Mutter schwermütig (deprimiert/melancholisch).
- Keine Geschwister.

**Sozialanamnese:**
- Beamter im Ordnungsamt (berichte von Stress).
- Aktuell in Scheidung lebend.
- 2 Kinder (1 Tochter, 27 Jahre; 1 Adoptivsohn, 25 Jahre).
- Lebe alleine.`,
                    diagnosis: 'Apoplex'

                {
                    id: 'ms_neuro2',
                    title: 'Migräne',

**Vegetative Anamnese:**

**Vorerkrankungen und Voroperationen:**
- Unguis incarnatus (eingewachsener Zehennagel rechts).
- Zustand nach Ovarialzysten-OP vor 5 Jahren.
- Arterielle Hypotonie.

**Medikamente:**

**Allergien:**

- Laktoseintoleranz.

**Noxen:**

                {
                    id: 'ms_neuro3',
                    title: 'Epileptischer Anfall',
                    case_description: `**Patient:** Herr Fridolin Sauer, 37 Jahre  (geb. 14.05.1988), 182 cm, 87 kg.

**Aufnahmegrund:**
Vor 3 Stunden plötzlich aufgetretene, generalisierte Myoklonien (Muskelzuckungen).

**Aktuelle Anamnese:**
Der Patient stelle sich in Begleitung seiner Ehefrau (mit Rettungsdienst) vor. Er berichte, dass er heute Morgen nach dem Frühstück plötzlich ein "komisches Gefühl" im ganzen Körper verspürt habe und nicht mehr ansprechbar gewesen sei. Anschließend seien generalisierte Zuckungen aufgetreten, die etwa 1-2 Minuten angedauert hätten. Vor dem Frühstück, als er auf der Toilette gewesen sei, habe er innere Unruhe, Photopsien (Flimmern/Lichtblitze vor den Augen) und Cephalgie (Kopfschmerzen) bemerkt. Laut seiner Ehefrau sei er vor dem Anfall erstarrt, und die Myoklonien hätten ebenfalls 1-2 Minuten gedauert. Herr Sauer füge hinzu, dass er in den 4 Tagen vor dem Anfall besonders nervös und unruhig gewesen sei. Als möglichen Auslöser nenne er den übermäßigen Alkoholkonsum auf der 10. Jubiläumsfeier seiner Firma am Vorabend. Nach dem Anfall seien ihm Fatigue (Abgeschlagenheit) und starke Myalgien (Muskelschmerzen) aufgefallen. Fragen nach Kopfplatzwunde, Zungenbiss, Stuhl- und Urinabgang seien verneint worden. Er sei nicht hingefallen, da seine Frau ihn festgehalten habe. Solche Beschwerden habe er bisher noch nie gehabt.

- Zustand nach fieberbedingtem Krampfanfall im 5. Lebensjahr, medikamentös mit Paracetamol-Suppositorien (Zäpfchen) behandelt.
- Alkoholintoxikation (Alkoholvergiftung) mit 17 Jahren, stationär behandelt.
Bisher keine Operationen.

**Medikamente:**
- Imodium 75 mg b.B.
- Cortison-Salbe b.B. (vor allem im Winter)
- Neoangin-Plus - Lutschtabletten b.B.
- Ibuprofen-Gel b.B.

**Allergien und Unverträglichkeiten:**
- Hausstaubmilben mit Rhinokonjunktivitis.
- Meeresfrüchte mit Lidödem (geschwollene Augen).

**Genussmittel:**
- Nikotinkonsum: Seit 5 Jahren 10 Zigaretten pro Tag. Zuvor 20 Packungsjahre (PY).
- Alkoholkonsum: Gelegentlich Bier und Schnaps (manchmal übermäßiger Konsum bei Partys).
- Drogenkonsum: Ein Joint pro Monat.

**Sozialanamnese:**

- Verheiratet, wohne mit seiner Familie.
- Habe einen Sohn (8 Jahre) mit Herzvitium (Loch in der Herzscheidewand). Dies bereite ihm Sorgen, der Sohn sei kardiologisch untersucht und konservativ behandelt worden. Eine zukünftige chirurgische Therapie sei jedoch möglicherweise erforderlich.

**Familienanamnese:**
- Vater: Keratitis (Hornhautentzündung), Zustand nach Korneatransplantation/Keratoplastik (Hornhautverpflanzung) vor 4 Monaten.
- Mutter: Morbus Sudeck/CRPS bei Zustand nach distaler Radiusfraktur (Handgelenksbruch). Sie habe nach wie vor mit starken Schmerzen nach ihrem Handgelenksbruch zu kämpfen.`,
                    diagnosis: 'Epileptischer Anfall'

                {

                    title: 'Polyneuropathie bei Borreliose',
                    case_description: `**Patientin:** Frau Mildred Färber, 41 Jahre (geb. 04.05.1978), 164 cm, 69 kg.

**Aufnahmegrund:**
Seit 10 Tagen plötzlich aufgetretene Sehstörungen (verschwommenes Sehen, Farbsehstörung) nur im rechten Auge, begleitet von Kribbeln und Taubheitsgefühl in beiden Händen, sowie leichten retrobulbären Kopfschmerzen.

**Vorerkrankungen und Voroperationen:**

**Familienanamnese:**

**Aktuelle Anamnese:**

                    case_description: `**Patient:** Frau Bettina Wenzen, 62 Jahre (geb. 14.01.1960), 78 kg, 187 cm.

**Aufnahmegrund:**
Selbstvorstellung bei seit mehreren Wochen progredienter Dyspnoe und thorakalem Engegefühl.

**Aktuelle Anamnese:**
Die Patientin berichte über eine seit 5-7 Wochen bestehende, langsam progrediente Symptomatik. Im Vordergrund stünden eine Belastungsdyspnoe, die mittlerweile auch in Ruhe aufträte, sowie ein thorakales Engegefühl. Die Patientin schildere, dass sie beim Treppensteigen bereits nach einem Stockwerk eine Pause benötige. Begleitend seien ihr eine Orthopnoe (Schlafen auf 2-3 Kissen), beidseitige Beinödeme und eine zunehmende Nykturie (3-4x pro Nacht) aufgefallen. Zudem klage sie über ausgeprägte Fatigue und Konzentrationsstörungen.

        function renderCases() {
            container.innerHTML = '';

            if (!muensterCases) {
                container.innerHTML = '<p>Keine Fälle für Münster gefunden.</p>';
                return;
            }

            for (const [specialty, cases] of Object.entries(muensterCases)) {
                const specialtyName = specialty.charAt(0).toUpperCase() + specialty.slice(1).replace(/_/g, ' ');

                const specialtyDetails = document.createElement('details');
                specialtyDetails.className = 'specialty-group';

                const specialtySummary = document.createElement('summary');
                specialtySummary.innerHTML = `<span>${specialtyName}</span> <span class="badge">${cases.length} Fälle</span>`;
                specialtyDetails.appendChild(specialtySummary);

                const specialtyContent = document.createElement('div');
                specialtyContent.className = 'specialty-content';

                cases.forEach(caseItem => {
                    const caseDetails = document.createElement('details');
                    caseDetails.className = 'case-item';

                    const caseSummary = document.createElement('summary');
                    caseSummary.innerHTML = `<span>${caseItem.title}</span>`;
                    caseDetails.appendChild(caseSummary);

                    const caseContent = document.createElement('div');
                    caseContent.className = 'case-content';

                    let formattedDescription = caseItem.case_description || '';
                    formattedDescription = formattedDescription.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

                    caseContent.innerHTML = `
                        <div class="case-diagnosis">Diagnose: ${caseItem.diagnosis}</div>
                        <div class="case-description">${formattedDescription}</div>
                    `;

                    caseDetails.appendChild(caseContent);
                    specialtyContent.appendChild(caseDetails);
                });

                specialtyDetails.appendChild(specialtyContent);
                container.appendChild(specialtyDetails);
            }
        }

        renderCases();

        // Toggle logic
        document.getElementById('expand-all').addEventListener('click', () => {
            document.querySelectorAll('details').forEach(d => d.open = true);
        });

        document.getElementById('collapse-all').addEventListener('click', () => {
            document.querySelectorAll('details').forEach(d => d.open = false);
        });
    </script>
