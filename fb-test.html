<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medizinische Karteikarten</title>
    <style>
        :root {
            --primary: #3b82f6;
            --success: #22c55e;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.7);
            --text: #1e293b;
            --header-text: #64748b;
            --glass-border: rgba(255, 255, 255, 0.3);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            --btn-text: white;
        }

        [data-theme="dark"] {
            --primary: #60a5fa;
            --success: #4ade80;
            --danger: #f87171;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f1f5f9;
            --header-text: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --btn-text: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(at 0% 0%, hsla(210, 100%, 93%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 0.1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(190, 100%, 91%, 1) 0, transparent 50%);
            background-attachment: fixed;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.5s ease, color 0.3s ease;
        }

        [data-theme="dark"] body {
            background-image: radial-gradient(at 0% 0%, hsla(222, 47%, 11%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(222, 47%, 15%, 1) 0, transparent 50%);
        }

        /* Nav/Header */
        .top-nav {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .nav-btn {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
            box-shadow: var(--shadow);
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.1);
        }

        .header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--header-text);
            letter-spacing: 0.5px;
        }

        /* The Flashcard Container */
        .card-container {
            perspective: 1200px;
            width: 100%;
            max-width: 500px;
            height: 380px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 24px;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .card-front {
            z-index: 2;
        }

        .card-front h2 {
            font-size: 2.8rem;
            color: var(--primary);
            font-weight: 800;
            line-height: 1.1;
        }

        .card-front p {
            color: var(--header-text);
            font-size: 0.85rem;
            margin-top: 30px;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        .card-back h3 {
            font-size: 1rem;
            color: var(--header-text);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
        }

        .card-back p {
            font-size: 1.6rem;
            line-height: 1.4;
            font-weight: 600;
        }

        /* Controls */
        .controls {
            margin-top: 40px;
            width: 100%;
            max-width: 500px;
            display: flex;
            gap: 20px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            transform: translateY(10px);
        }

        .controls.active {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0);
        }

        .btn {
            flex: 1;
            padding: 18px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow);
            color: var(--btn-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .btn span {
            font-size: 0.7rem;
            opacity: 0.7;
            font-weight: 400;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:hover {
            transform: translateY(-4px);
            filter: brightness(1.1);
        }

        .btn-fail {
            background: var(--danger);
        }

        .btn-pass {
            background: var(--success);
        }

        /* Feedback Animations */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-8px);
            }

            75% {
                transform: translateX(8px);
            }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Glossary Panel */
        .panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 200;
            display: none;
            flex-direction: column;
            padding: 40px 20px;
            overflow-y: auto;
        }

        .panel.active {
            display: flex;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 30px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 1.1rem;
            outline: none;
            box-shadow: var(--shadow);
        }

        .glossary-list {
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .glossary-item {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .glossary-item b {
            color: var(--primary);
            font-size: 1.2rem;
        }

        .close-panel {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .reset-link {
            margin-top: 40px;
            color: #9ca3af;
            font-size: 0.75rem;
            text-decoration: none;
            cursor: pointer;
            border: none;
            background: none;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .reset-link:hover {
            opacity: 1;
        }

        .empty-state {
            display: none;
            text-align: center;
        }

        /* Hide scrollbar for glossary */
        .panel::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>

<body>

    <div class="top-nav">
        <button class="nav-btn" onclick="toggleGlossary()" title="Glossary">📖</button>
        <button class="nav-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle Theme">🌙</button>
    </div>

    <div class="header">
        <span id="due-count">Fällig: 0</span>
        <span id="total-count">Gesamt: 0</span>
    </div>

    <div id="finished-msg" class="empty-state">
        <h2 style="font-size: 3rem;">🎉</h2>
        <h2>Alles erledigt!</h2>
        <p style="margin-top:10px; color:var(--header-text);">Du hast alle Karten für den Moment gelernt.</p>
        <button onclick="resetReviewTimes()" class="btn btn-pass" style="margin: 30px auto; max-width: 200px;">Alles
            wiederholen</button>
    </div>

    <div class="card-container" id="card-container" onclick="flipCard()">
        <div class="card" id="flashcard">
            <div class="card-face card-front">
                <h2 id="term-display">Lädt...</h2>
                <p>Space zum Umdrehen</p>
            </div>
            <div class="card-face card-back">
                <h3>Definition</h3>
                <p id="def-display">...</p>
            </div>
        </div>
    </div>

    <div class="controls" id="controls">
        <button class="btn btn-fail" onclick="handleResult(false, event)">
            Vergessen 🧠
            <span>[←] / [0]</span>
        </button>
        <button class="btn btn-pass" onclick="handleResult(true, event)">
            Gewusst ✅
            <span>[→] / [1]</span>
        </button>
    </div>

    <!-- Glossary Panel -->
    <div class="panel" id="glossary-panel">
        <button class="nav-btn close-panel" onclick="toggleGlossary()">✕</button>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Nach Fachbegriffen suchen..." oninput="filterGlossary()">
        </div>
        <div class="glossary-list" id="glossary-list">
            <!-- Items injected via JS -->
        </div>
    </div>

    <button class="reset-link" onclick="hardReset()">Alle Daten zurücksetzen</button>

    <script type="module">
        // --- 1. DIE DATEN (THE DATA) ---
        // Hier können Sie die Begriffe ändern
        let fbdata = [];
        try {
            const response = await fetch('./fb.json');
            fbdata = await response.json();
        } catch (error) {
            console.error('Error fetching data:', error);
            fbdata = [
                { "term": "Caput, Cephalon", "definition": "Kopf" },
                { "term": "Regio frontalis, Frons", "definition": "Stirn, Stirnregion" },
                { "term": "Regio temporalis", "definition": "Schläfe, Schläfenregion" }
            ];
        }

        const STORAGE_KEY = 'medical_flashcards_de_v1';


        // --- 2. STATE MANAGEMENT ---
        let cards = [];
        let currentCard = null;
        // Start the app
        init();
        // Updated storage key to avoid conflict with English version if tested on same domain
        // Initialize
        function init() {
            // Theme check - Default to dark
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('theme-btn').textContent = savedTheme === 'dark' ? '☀️' : '🌙';

            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                cards = JSON.parse(stored);
            } else {
                // First time load: Add timestamp to default data and shuffle
                cards = fbdata.map(item => ({
                    ...item,
                    nextReview: Date.now(), // Due immediately
                    interval: 1 // Start interval at 1 minute equivalent logic
                })).sort(() => Math.random() - 0.5);
                saveData();
            }
            loadNextCard();
            renderGlossary();
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
            updateHeader();
        }

        // --- 3. SPACED REPETITION LOGIC ---
        function getDueCards() {
            const now = Date.now();
            return cards.filter(card => card.nextReview <= now);
        }

        function loadNextCard() {
            const due = getDueCards();

            // UI Handling for "No cards left"
            if (due.length === 0) {
                document.getElementById('card-container').style.display = 'none';
                document.getElementById('controls').classList.remove('active');
                document.getElementById('finished-msg').style.display = 'block';
                updateHeader();
                return;
            }

            // Reset UI for next card
            document.getElementById('card-container').style.display = 'block';
            document.getElementById('finished-msg').style.display = 'none';
            document.getElementById('flashcard').classList.remove('flipped');
            document.getElementById('controls').classList.remove('active');

            // Sequential order within due cards
            currentCard = due[0];

            // Render text
            document.getElementById('term-display').textContent = currentCard.term;
            document.getElementById('def-display').textContent = ''; // Hide definition until flip

            updateHeader();
        }

        // --- 4. INTERACTION ---
        function flipCard() {
            const card = document.getElementById('flashcard');
            const controls = document.getElementById('controls');

            if (!card.classList.contains('flipped')) {
                document.getElementById('def-display').textContent = currentCard.definition;
                card.classList.add('flipped');
                controls.classList.add('active');
            }
        }

        function handleResult(success, event) {
            if (event) event.stopPropagation();

            const container = document.getElementById('card-container');
            if (!success) {
                container.classList.add('shake');
                setTimeout(() => container.classList.remove('shake'), 400);
            }

            const now = Date.now();
            const ONE_MINUTE = 60 * 1000;

            if (success) {
                // If correct: Double the interval
                let newInterval = currentCard.interval * 2;
                currentCard.nextReview = now + (newInterval * ONE_MINUTE);
                currentCard.interval = newInterval;
            } else {
                // If wrong: Reset interval to 1 minute
                currentCard.nextReview = now + ONE_MINUTE;
                currentCard.interval = 1;
            }

            const index = cards.findIndex(c => c.term === currentCard.term && c.definition === currentCard.definition);
            cards[index] = currentCard;

            saveData();

            setTimeout(loadNextCard, 200);
        }

        // --- 5. NEW FEATURES ---
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('theme', target);
            document.getElementById('theme-btn').textContent = target === 'dark' ? '☀️' : '🌙';
        }

        function toggleGlossary() {
            document.getElementById('glossary-panel').classList.toggle('active');
        }

        function renderGlossary(filteredData = fbdata) {
            const list = document.getElementById('glossary-list');
            list.innerHTML = filteredData.map(item => `
                <div class="glossary-item">
                    <b>${item.term}</b>
                    <p>${item.definition}</p>
                </div>
            `).join('');
        }

        function filterGlossary() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = fbdata.filter(item =>
                item.term.toLowerCase().includes(query) ||
                item.definition.toLowerCase().includes(query)
            );
            renderGlossary(filtered);
        }

        // Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
            // Ignore if search is focused
            if (document.activeElement.id === 'search-input') return;

            const cardVisible = document.getElementById('card-container').style.display !== 'none';
            const flipped = document.getElementById('flashcard').classList.contains('flipped');

            if (e.code === 'Space' && cardVisible && !flipped) {
                e.preventDefault();
                flipCard();
            } else if (flipped) {
                if (e.key === '1' || e.key === 'Enter' || e.key === 'ArrowRight') handleResult(true);
                else if (e.key === '0' || e.key === 'Backspace' || e.key === 'ArrowLeft') handleResult(false);
            }
        });

        // --- 6. UTILITIES ---
        function updateHeader() {
            const dueCount = getDueCards().length;
            document.getElementById('due-count').textContent = `Fällig: ${dueCount}`;
            document.getElementById('total-count').textContent = `Gesamt: ${cards.length}`;
        }

        function resetReviewTimes() {
            cards = cards.map(c => ({ ...c, nextReview: Date.now(), interval: 1 }));
            saveData();
            loadNextCard();
        }

        function hardReset() {
            if (confirm("Dies löscht deinen gesamten Fortschritt. Bist du sicher?")) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }

        // Initialize
        // init() called at top of script

        // Expose functions globally for HTML onclick handlers
        window.flipCard = flipCard;
        window.handleResult = handleResult;
        window.hardReset = hardReset;
        window.resetReviewTimes = resetReviewTimes;
        window.toggleTheme = toggleTheme;
        window.toggleGlossary = toggleGlossary;
        window.filterGlossary = filterGlossary;
    </script>
</body>

</html>
